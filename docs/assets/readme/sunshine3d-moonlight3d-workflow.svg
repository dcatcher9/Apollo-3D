<text x="796" y="427" fill="#bccadd" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">one view per eye</text>
<text x="173" y="477" fill="#bccadd" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start">SBS = side-by-side: left and right eye views in one video frame.</text>
<rect x="30" y="497" width="886" height="58" rx="12" fill="#182332" stroke="#34455c"/>
