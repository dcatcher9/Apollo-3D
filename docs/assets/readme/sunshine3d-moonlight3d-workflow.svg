<svg xmlns="http://www.w3.org/2000/svg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-labelledby="title description">
<title id="title">Sunshine 3D + Moonlight 3D: where 3D happens</title>
<desc id="description">Host 3D: a flat picture goes to Sunshine 3D on the PC, which adds AI depth; Moonlight 3D shows stereo on the headset. Client 3D: Sunshine sends the flat picture; Moonlight adds AI depth on the headset. Raw SBS: Sunshine passes through the source&#x27;s authored left and right views, and Moonlight shows them in 3D. In 2D mode, the picture stays flat. Separate PC options are local presentation to connected AR glasses and offline conversion of video into a saved side-by-side file.</desc>
