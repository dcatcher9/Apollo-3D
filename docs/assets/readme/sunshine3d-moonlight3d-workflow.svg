<rect x="30" y="30" width="5" height="54" rx="2" fill="#f0c65b"/>
<text x="49" y="53" fill="#f1f5fc" font-size="28" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">Sunshine 3D + Moonlight 3D</text>
<text x="49" y="81" fill="#bccadd" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Choose where a flat picture becomes 3D.</text>
