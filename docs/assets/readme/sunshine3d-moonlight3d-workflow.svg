<text x="504" y="119" fill="#f0c65b" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">SUNSHINE 3D</text>
<text x="504" y="140" fill="#bccadd" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Windows PC</text>
<text x="796" y="119" fill="#91c4ff" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">MOONLIGHT 3D</text>
<text x="796" y="140" fill="#bccadd" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">Galaxy XR headset</text>
<text x="30" y="191" fill="#f1f5fc" font-size="20" font-family="Arial, Helvetica, sans-serif" text-anchor="start" font-weight="700">Host 3D</text>
<text x="30" y="216" fill="#bccadd" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="start">Depth on PC</text>
<rect x="173" y="158" width="166" height="80" rx="12" fill="#182332" stroke="#34455c"/>
<text x="256" y="191" fill="#f1f5fc" font-size="19" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">Flat picture</text>
<text x="256" y="217" fill="#bccadd" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">one view</text>
