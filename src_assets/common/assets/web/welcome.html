<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <main class="apollo-auth-page" role="main">
    <section class="apollo-auth-shell" aria-labelledby="welcome-title">
      <div class="apollo-auth-card">
        <header class="apollo-auth-brand">
          <span class="apollo-auth-mark">
            <img src="./images/logo-sunshine3d-45.png" alt="">
          </span>
          <div>
            <p class="apollo-eyebrow">Sunshine 3D host</p>
            <h1 id="welcome-title">{{ $t('welcome.greeting') }}</h1>
          </div>
        </header>
        <p class="apollo-auth-copy">{{ $t('welcome.create_creds') }}</p>
        <div class="alert alert-warning">
          {{ $t('welcome.create_creds_alert') }}
        </div>
        <form class="apollo-auth-form" @submit.prevent="save">
          <div>
            <label for="usernameInput" class="form-label">{{ $t('_common.username') }}</label>
            <input type="text" class="form-control" id="usernameInput" autocomplete="username"
              v-model="passwordData.newUsername" />
          </div>
          <div>
            <label for="passwordInput" class="form-label">{{ $t('_common.password') }}</label>
            <input type="password" class="form-control" id="passwordInput" autocomplete="new-password"
              v-model="passwordData.newPassword" required />
          </div>
          <div>
            <label for="confirmPasswordInput" class="form-label">{{ $t('welcome.confirm_password') }}</label>
            <input type="password" class="form-control" id="confirmPasswordInput" autocomplete="new-password"
              v-model="passwordData.confirmNewPassword" required />
          </div>
          <button type="submit" class="btn btn-apollo-primary w-100" v-bind:disabled="loading">
            {{ $t('welcome.login') }}
          </button>
          <div class="alert alert-danger" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</div>
          <div class="alert alert-success" v-if="success">
            <b>{{ $t('_common.success') }}</b> {{ $t('welcome.welcome_success') }}
          </div>
        </form>
      </div>
      <aside class="apollo-resource-stack" aria-label="Resources">
        <Resource-Card></Resource-Card>
      </aside>
    </section>
  </main>
</body>

<script type="module">
  import { createApp } from "vue"
  import ResourceCard from './ResourceCard.vue'
  import { initApp } from './init'
  import { loadAutoTheme } from './theme'

  let app = createApp({
    components: {
      ResourceCard
    },
    data() {
      loadAutoTheme()
      return {
        error: null,
        success: false,
        loading: false,
        passwordData: {
          newUsername: "sunshine3d",
          newPassword: "",
          confirmNewPassword: "",
        },
      };
    },
    methods: {
      save() {
        if (this.passwordData.newPassword !== this.passwordData.confirmNewPassword) {
          this.error = "Password mismatch";
          return;
        };
        this.error = null;
        this.loading = true;
        fetch("./api/password", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((r) => {
          this.loading = false;
          if (r.status === 200) {
            r.json().then((rj) => {
              this.success = rj.status;
              if (this.success === true) {
                setTimeout(() => {
                  document.location.reload();
                }, 5000);
              } else {
                this.error = rj.error;
              }
            });
          } else {
            this.error = "Internal Server Error";
          }
        });
      },
    },
  });

  initApp(app);
</script>
