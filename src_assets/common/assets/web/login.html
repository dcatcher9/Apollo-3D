<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <main class="apollo-auth-page" role="main">
    <section class="apollo-auth-shell is-compact" aria-labelledby="login-title">
      <div class="apollo-auth-card">
        <header class="apollo-auth-brand">
          <span class="apollo-auth-mark">
            <img src="/images/logo-sunshine3d-45.png" alt="">
          </span>
          <div>
            <p class="apollo-eyebrow">Sunshine 3D host</p>
            <h1 id="login-title">{{ $t('welcome.greeting') }}</h1>
          </div>
        </header>
        <form class="apollo-auth-form" @submit.prevent="login">
          <div>
            <label for="usernameInput" class="form-label">{{ $t('_common.username') }}</label>
            <input type="text" class="form-control" id="usernameInput" autocomplete="username"
              v-model="passwordData.username" required autofocus/>
          </div>
          <div>
            <label for="passwordInput" class="form-label">{{ $t('_common.password') }}</label>
            <input type="password" class="form-control" id="passwordInput" autocomplete="current-password"
              v-model="passwordData.password" required />
          </div>
          <div class="form-check">
            <label for="rememberUsername" class="form-check-label">Remember username</label>
            <input type="checkbox" class="form-check-input" id="rememberUsername" v-model="rememberUsername"/>
          </div>
          <button type="submit" class="btn btn-apollo-primary w-100" v-bind:disabled="loading">
            {{ $t('welcome.login') }}
          </button>
          <div class="alert alert-danger" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</div>
          <div class="alert alert-success" v-if="success">
            <b>{{ $t('_common.success') }}</b> {{ $t('welcome.login_success') }}
          </div>
        </form>
      </div>
    </section>
  </main>
</body>

<script type="module">
  import { createApp, ref } from "vue"
  import { loadAutoTheme } from './theme'
  import { initApp } from './init'

  let app = createApp({
    setup() {
      loadAutoTheme()

      const error = ref('');
      const success = ref(false);
      const loading = ref(false);
      const rememberUsername = ref(false);
      const data = {
        error,
        success,
        loading,
        rememberUsername,
        passwordData: {
          username: '',
          password: ''
        }
      }

      // Older Sunshine 3D versions could store a plaintext password in localStorage. Migrate only
      // the username and remove the legacy value as soon as this page is loaded.
      const legacyLogin = localStorage.getItem('login')
      if (legacyLogin) {
        try {
          const { username } = JSON.parse(legacyLogin);
          if (username) localStorage.setItem('login_username', username)
        } catch (e) {
          console.error('Reading legacy login failed!', e);
        }
        localStorage.removeItem('login')
      }

      const savedUsername = localStorage.getItem('login_username')
      if (savedUsername) {
        rememberUsername.value = true
        data.passwordData.username = savedUsername
      }

      return data
    },
    methods: {
      login() {
        this.error = null;
        this.loading = true;
        if (!this.rememberUsername) {
          localStorage.removeItem('login_username')
        }
        fetch("./api/login", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((res) => {
          this.loading = false;
          if (res.status === 200) {
            this.success = true;
            if (this.rememberUsername) {
              localStorage.setItem('login_username', this.passwordData.username);
            }
            const url = new URL(window.location);
            const redirectUrl = url.searchParams.get('redir');
            const hash = url.hash;
            if (redirectUrl && redirectUrl.startsWith('.')) {
              location.href = redirectUrl + hash;
            } else {
              location.href = './' + hash;
            }
          } else {
            if (res.status === 401) {
              throw new Error('Please check your username and password')
            } else {
              throw new Error(`Server returned ${res.status}`);
            }
          }
        }).catch((e) => {
          this.error = `Login failed: ${e.message}`;
        });
      },
    },
  });

  initApp(app);
</script>
